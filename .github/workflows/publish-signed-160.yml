name: Publish original-key signed Shaplum 1.6.0 APK
on:
  push:
    paths: ['.github/workflows/publish-signed-160.yml']
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve confirmed unsigned production build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download 44248061871 --name ShaplumKidsGames-1.6.0-Unsigned-Release --dir input
      - name: Reconstruct and verify exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,hashlib
          from pathlib import Path
          p=json.loads(gzip.decompress(base64.b64decode("")))
          a=next(Path("input").rglob("app-release-unsigned.apk")).read_bytes()
          assert hashlib.sha256(a).hexdigest()==p["source_sha256"]
          b=b"".join(a[o[1]:o[1]+o[2]] if o[0]=="copy" else base64.b64decode(o[1]) for o in p["ops"])
          assert hashlib.sha256(b).hexdigest()=="18483a414b074adda102e51aae9d2880342d441a5afdb3f349f0d6764cbc8068"
          Path("ShaplumKidsGames-1.6.0-Release-Signed.apk").write_bytes(b)
          PY
          java -jar "$(find input -name apksigner.jar -print -quit)" verify --print-certs ShaplumKidsGames-1.6.0-Release-Signed.apk | tee cert.txt
          grep -qi 'efd3d1376421899afe8e08ee9cfdc8b5ca502bc9dd8c6ef33d733546f8fe5690' cert.txt
          if [ -x "$ANDROID_HOME/build-tools/35.0.0/zipalign" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 ShaplumKidsGames-1.6.0-Release-Signed.apk
          fi
          sha256sum ShaplumKidsGames-1.6.0-Release-Signed.apk > SHA256SUMS.txt
      - name: Publish verified Release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=shaplum-1.6.0-release
          gh release view "$tag" || gh release create "$tag" --target fc487663ecd0bfbf28e5c4dbe728266a69604e0d --title "Shaplum Kids Games 1.6.0 - Signed Release" --notes "New volumetric toy renderer, eight distinct mode illustrations, revised home routing and drag visuals. Signed with original certificate. Visual device QA pending; ads disabled and privacy URL requires configuration before store submission." --prerelease
          gh release upload "$tag" ShaplumKidsGames-1.6.0-Release-Signed.apk SHA256SUMS.txt --clobber
