name: Shaplum Kids Games 1.6.0 APK

on:
  push:
    branches: [main]
    paths:
      - 'ShaplumKidsGames_1.1.0_SourceForGitHub.zip'
      - '.github/workflows/shaplum-android.yml'
      - 'design/apply_v16.py'
      - 'ShaplumKidsGames_1.2.0_Overlay.zip'
      - 'ShaplumKidsGames_1.3.0_RealRedesign_Overlay.zip'
      - 'ShaplumKidsGames_1.4.0_Gameplay_Redesign_Overlay.zip'
      - 'ShaplumKidsGames_1.5.0_UX_Language_Home_Overlay.zip'
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed Release with the ORIGINAL signing key'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    name: Build, test and package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract archived Android project
        shell: bash
        run: |
          set -euo pipefail
          archive=ShaplumKidsGames_1.1.0_SourceForGitHub.zip
          test -s "$archive" || { echo "ERROR: upload $archive at the root of this repository"; exit 1; }
          if unzip -Z1 "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "ERROR: Unsafe archive paths"; exit 1
          fi
          unzip -q "$archive"
          test -s ShaplumKidsGames_1.2.0_Overlay.zip || { echo "Missing v1.2 overlay"; exit 1; }
          unzip -qo ShaplumKidsGames_1.2.0_Overlay.zip
          test -s ShaplumKidsGames_1.3.0_RealRedesign_Overlay.zip || { echo 'Missing v1.3 redesign'; exit 1; }
          unzip -qo ShaplumKidsGames_1.3.0_RealRedesign_Overlay.zip
          test -s ShaplumKidsGames_1.4.0_Gameplay_Redesign_Overlay.zip
          unzip -qo ShaplumKidsGames_1.4.0_Gameplay_Redesign_Overlay.zip
          test -s ShaplumKidsGames_1.5.0_UX_Language_Home_Overlay.zip
          unzip -qo ShaplumKidsGames_1.5.0_UX_Language_Home_Overlay.zip
          test -f ShaplumKidsGames/settings.gradle.kts
          test -f ShaplumKidsGames/app/build.gradle.kts
          chmod +x ShaplumKidsGames/gradlew
      - name: Restore missing translated playroom resources and fix shared animation visibility
        working-directory: ShaplumKidsGames
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          base = Path("app/src/main/res")
          names = ["v13_choose_level", "v13_kids_games", "v13_play_now", "v13_pick_a_game", "v13_all_open", "v13_levels_open"]
          strings = {
              "values": ["Choose a level", "Kids Games", "Play now", "Pick a game", "All games are open", "All levels are open"],
              "values-en-rGB": ["Choose a level", "Kids Games", "Play now", "Pick a game", "All games are open", "All levels are open"],
              "values-ar": ["اختر مرحلة", "ألعاب الأطفال", "العب الآن", "اختر لعبة", "جميع الألعاب متاحة", "جميع المراحل متاحة"],
              "values-pt-rBR": ["Escolha uma fase", "Jogos infantis", "Jogar agora", "Escolha um jogo", "Todos os jogos estão abertos", "Todas as fases estão abertas"],
          }
          for directory in base.glob("values*"):
              if not (directory / "strings.xml").exists():
                  continue
              locale = directory.name
              vals = strings.get(locale, strings["values"])
              existing = set()
              for x in directory.glob("*.xml"):
                  existing.update(e.attrib.get("name") for e in ET.parse(x).getroot() if e.tag == "string")
              target = directory / "strings.xml"
              source = target.read_text(encoding="utf-8")
              entries = "".join('    <string name="' + key + '">' + value + '</string>\n' for key, value in zip(names, vals) if key not in existing)
              if entries:
                  assert "</resources>" in source
                  target.write_text(source.replace("</resources>", entries + "</resources>"), encoding="utf-8")
          for target in Path("app/src/main/java").rglob("*.kt"):
              source = target.read_text(encoding="utf-8")
              updated = re.sub(r'\bprivate\s+fun\s+CelebrationBurst\s*\(', 'internal fun CelebrationBurst(', source)
              if source != updated:
                  target.write_text(updated, encoding="utf-8")
          target = Path("app/build.gradle.kts")
          source = target.read_text(encoding="utf-8")
          source = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 6', source, count=1)
          source = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.5.0"', source, count=1)
          target.write_text(source, encoding="utf-8")
          PY
      - name: Apply 1.6 actual toy renderer, game art and home screen
        working-directory: ShaplumKidsGames
        run: python3 ../design/apply_v16.py
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify all translations
        working-directory: ShaplumKidsGames
        run: python3 tools/verify_resources.py
      - name: Test, lint and compile Debug APK
        working-directory: ShaplumKidsGames
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShaplumKidsGames-1.6.0-Debug-APK
          path: ShaplumKidsGames/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShaplumKidsGames-1.6.0-Test-Reports
          path: |
            ShaplumKidsGames/app/build/reports/
            ShaplumKidsGames/app/build/test-results/
          if-no-files-found: warn
      - name: Assemble unsigned production APK for private offline signing
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_release
        working-directory: ShaplumKidsGames
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p "$RUNNER_TEMP/shaplum-signing-tools"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/shaplum-signing-tools/"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$RUNNER_TEMP/shaplum-signing-tools/"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | sed -n '1,3p'
      - name: Upload unsigned Release and signing utilities
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_release
        uses: actions/upload-artifact@v4
        with:
          name: ShaplumKidsGames-1.6.0-Unsigned-Release
          path: |
            ShaplumKidsGames/app/build/outputs/apk/release/app-release-unsigned.apk
            ${{ runner.temp }}/shaplum-signing-tools/apksigner.jar
            ${{ runner.temp }}/shaplum-signing-tools/zipalign
          if-no-files-found: error
          retention-days: 7
      - name: Load private ORIGINAL release signing key
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          CONTACT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          for item in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS POLICY_URL CONTACT_EMAIL; do
            test -n "${!item}" || { echo "Missing signing secret or release variable: $item"; exit 1; }
          done
          [[ "$POLICY_URL" == https://* ]] || { echo "Need an HTTPS privacy policy URL"; exit 1; }
          [[ "$CONTACT_EMAIL" == *@* ]] || { echo "Need a support email"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shaplum-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/shaplum-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        working-directory: ShaplumKidsGames
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify release signature against ORIGINAL 1.0.0
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        shell: bash
        run: |
          set -euo pipefail
          apk="ShaplumKidsGames/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature-check.txt"
          actual=$(awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}' "$RUNNER_TEMP/apk-signature-check.txt")
          expected="EFD3D1376421899AFE8E08EE9CFDC8B5CA502BC9DD8C6EF33D733546F8FE5690"
          test "$actual" = "$expected" || { echo "WRONG SIGNING KEY - STOP"; exit 1; }
          echo "$actual" > ShaplumKidsGames/app/build/outputs/apk/release/certificate-sha256.txt
      - name: Upload verified signed Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        uses: actions/upload-artifact@v4
        with:
          name: ShaplumKidsGames-1.6.0-Signed-Release
          path: |
            ShaplumKidsGames/app/build/outputs/apk/release/app-release.apk
            ShaplumKidsGames/app/build/outputs/apk/release/certificate-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/shaplum-release.jks" "$RUNNER_TEMP/apk-signature-check.txt"
